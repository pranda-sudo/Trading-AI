name: Geopolitical news RSS refresh
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: geopolitical-news-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch public RSS headlines
        run: python research/fetch_geopolitical_news.py
      - name: Commit updated feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add geopolitical-news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public market news headlines"
            git push
          fi
